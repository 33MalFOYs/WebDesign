<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>

      body{
        margin: 0;
        padding: 0;
        background: white;
      }
  
      .main {
        height: 100vh;
        margin: 3em;
        padding: 0 3em;
        display: flex;
        gap: 3em;
        background: #25384B;
      }

      .left-section {
        flex:1;
        background: #A3CFCC;
      
      }

      .right-section {
        box-sizing: border-box;
        width:10em;
        padding:1em ;
        flex:1;
        display:flex;
        flex-direction:column;
        justify-content:space-around;
        gap:1em;
        background: #F7CFB6;
       
      }

      .item {
        height:100px;
        flex-shrink:0;
        background: #86C2DE;
      }
 
    </style>
  </head>
  <body>
    <div class="main">
      <section class="left-section"></section>
      <section class="right-section">
        <div class="item"></div>
        <div class="item"></div>
        <div class="item"></div>
      </section>
    </div>
  </body>
</html>
