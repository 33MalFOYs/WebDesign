<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product-Catalog</title>
</head>
<body>
    <h2>Product-Catalog</h2>
        <table style="border: 1px solid black; border-collapse: collapse;">
            <tr style="border: 1px solid black; border-collapse: collapse;">
                <th style="border: 1px solid black; border-collapse: collapse;">Product Name</th>
                <th style="border: 1px solid black; border-collapse: collapse;">Price</th>
                <th style="border: 1px solid black; border-collapse: collapse;">Quantity</th>
                <th style="border: 1px solid black; border-collapse: collapse;">In Stock</th>
            </tr>
            <tr style="border: 1px solid black; border-collapse: collapse;">
                <td style="border: 1px solid black; border-collapse: collapse;">T-Shirt</td>
                <td style="border: 1px solid black; border-collapse: collapse;">10$</td>
                <td style="border: 1px solid black; border-collapse: collapse;">20 </td>
                <td style="border: 1px solid black; border-collapse: collapse;">Yes</td>
            </tr>
            <tr style="border: 1px solid black; border-collapse: collapse;">
                <td style="border: 1px solid black; border-collapse: collapse;">Denim</td>
                <td style="border: 1px solid black; border-collapse: collapse;">15$</td>
                <td style="border: 1px solid black; border-collapse: collapse;">1862</td>
                <td style="border: 1px solid black; border-collapse: collapse;">Yes</td>
            </tr>
            <tr style="border: 1px solid black; border-collapse: collapse;">
                <td style="border: 1px solid black; border-collapse: collapse;">Jacket</td>
                <td style="border: 1px solid black; border-collapse: collapse;">13$</td>
                <td style="border: 1px solid black; border-collapse: collapse;">12</td>
                <td style="border: 1px solid black; border-collapse: collapse;">Yes</td>
            </tr>
</body>
</html>
