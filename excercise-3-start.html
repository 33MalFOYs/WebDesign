<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 1rem;
      font-family: Arial, sans-serif;
    }

    .page {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 1rem;
    }

    header {
      grid-column: 1 / 3;
      padding: 1.5rem;
      background-color: #1e90ff;
      border-radius: 0.5rem;
      box-shadow: 0 3px #0077ea;
    }

    main {
      padding: 1rem;
      background-color: #3cb371;
      border-radius: 0.5rem;
      box-shadow: 0 3px #2f8d59;
    }

    aside {
      padding: 1rem;
      background-color: #ff6347;
      border-radius: 0.5rem;
      box-shadow: 0 3px #e02200;
    }

    footer {
      grid-column: 1 / 3;
      padding: 1.5rem;
      background-color: #4169e1;
      border-radius: 0.5rem;
      box-shadow: 0 3px #1d44b8;
    }

    h1,
    h2,
    p {
      margin: 0;
      color: white;
      font-size: 1rem;
    }

    .items {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      margin-top: 1rem;
    }

    .item {
      padding: 1.5rem 1rem;
      text-align: center;
      color: white;
      background-color: #2f8d59;
      border-radius: 0.5rem;
      box-shadow: 0 3px #226741;
    }

    @media (max-width: 700px) {
      .page {
        grid-template-columns: 1fr;
      }

      header,
      footer {
        grid-column: 1;
      }

      .items {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header>
      <h1>header</h1>
    </header>

    <main>
      <p>main</p>

      <div class="items">
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
        <div class="item">item</div>
      </div>
    </main>

    <aside>
      <h2>sidebar</h2>
    </aside>

    <footer>
      <p>footer</p>
    </footer>
  </div>
</body>
</html>
